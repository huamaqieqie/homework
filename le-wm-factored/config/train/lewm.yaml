defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: factored_lewm
subdir: ${hydra:job.id}
resume_ckpt_path: null

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192
  static_dim: 96
  dynamic_dim: 96

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  static_consistency:
    weight: 0.1
  static_variance:
    weight: 0.0
    target_std: 1.0
    eps: 0.0001
  static_dynamic_decorrelation:
    weight: 0.0
